# MegaLinter configuration — https://megalinter.io/latest/config-file/
# Scoped to what this repo actually has: C# (dotnet-format, Roslynator via DOTNET_FORMAT/CSHARP),
# the CI/perf Python scripts, GitHub Actions workflow files, YAML/JSON/Markdown.
# Report-only for now (the `lint` job is not in CI OK's `needs`) until a first clean pass confirms
# the ruleset before it becomes a merge gate.

APPLY_FIXES: none

FILTER_REGEX_EXCLUDE: >-
  (^|/)(bin|obj|artifacts|nupkgs|BenchmarkDotNet\.Artifacts|TestResults|\.git|\.github/workflows/.*\.md)(/|$)

# Docs are translated (docs/en, docs/es) and carry intentional duplication across languages/versions.
DISABLE_LINTERS:
  - SPELL_CSPELL
  - COPYPASTE_JSCPD
  - REPOSITORY_TRIVY
  - REPOSITORY_TRUFFLEHOG

SHOW_ELAPSED_TIME: true
PRINT_ALPACA: false
